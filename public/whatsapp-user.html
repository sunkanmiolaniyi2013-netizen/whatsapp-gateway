<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Gateway Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #ffffff;
            --surface: #f9fafb;
            --border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #25d366;
            --accent-hover: #1ea952;
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #25d366, #128c7e);
        }

        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; }
        p { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }

        .device-list {
            text-align: left;
            margin-bottom: 24px;
        }

        .device-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .device-info { display: flex; align-items: center; gap: 12px; }
        .device-icon { width: 40px; height: 40px; background: rgba(37, 211, 102, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; fill: var(--accent); }
        .device-icon svg { width: 20px; height: 20px; }
        .device-details strong { display: block; font-size: 14px; color: var(--text-main); }
        .device-details span { font-size: 12px; color: var(--text-muted); }
        .device-status { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .status-open { background: rgba(37, 211, 102, 0.1); color: var(--accent-hover); }
        .status-qr { background: #fef3c7; color: #d97706; }
        .status-disconnected { background: #fee2e2; color: #ef4444; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 14px 24px;
            background: var(--accent); color: white; font-family: inherit; font-size: 15px; font-weight: 600;
            border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(37, 211, 102, 0.2); margin-top: 12px;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-secondary { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); box-shadow: none; }
        .btn-secondary:hover { background: #f3f4f6; }

        .qr-box {
            background: var(--surface); border: 1px dashed #cbd5e1; border-radius: 12px; padding: 24px;
            min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 24px; transition: all 0.3s ease; display: none;
        }
        .qr-box img { width: 220px; height: 220px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .loader { width: 32px; height: 32px; border: 3px solid rgba(37, 211, 102, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        .error-message { color: #ef4444; font-size: 14px; background: #fef2f2; padding: 12px; border-radius: 8px; border: 1px solid #fecaca; margin-bottom: 24px; display: none; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>WhatsApp Connections</h1>
    <p>Manage all physical WhatsApp numbers linked to this GoHighLevel sub-account.</p>

    <div class="error-message" id="errorMessage"></div>

    <div id="deviceList" class="device-list">
        <!-- Devices will be listed here -->
    </div>

    <div class="qr-box" id="qrBox">
        <div class="loader" id="loader"></div>
        <div class="status-text" id="statusText">Generating Secure QR Code...</div>
        <img id="qrImage" src="" alt="WhatsApp QR Code" style="display:none;">
    </div>

    <button class="btn" id="addDeviceBtn" onclick="initializeConnection(true)">+ Connect Another Number</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const locationId = urlParams.get('location_id') || urlParams.get('locationId');
    let pollInterval = null;
    let activeInstanceId = null;

    let ghlUsers = [];

    if (!locationId) {
        showError("Invalid access: Missing location_id.");
        document.getElementById('addDeviceBtn').style.display = 'none';
    } else {
        fetchUsers().then(() => {
            checkCurrentStatus();
            startPolling();
        });
    }

    async function fetchUsers() {
        try {
            const res = await fetch(`/whatsapp/setup/users?location_id=${locationId}`);
            if (res.ok) {
                const data = await res.json();
                ghlUsers = data.users || [];
            }
        } catch (e) {
            console.error("Failed to load users for dropdown:", e);
        }
    }

    async function assignUser(instanceId, selectElement) {
        const userId = selectElement.value;
        selectElement.disabled = true;
        try {
            await fetch('/whatsapp/setup/assign', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ instance_id: instanceId, user_id: userId })
            });
            selectElement.style.borderColor = 'var(--accent)';
            setTimeout(() => selectElement.style.borderColor = 'var(--border)', 1500);
        } catch (e) {
            showError("Failed to assign user.");
        } finally {
            selectElement.disabled = false;
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorMessage');
        err.textContent = msg;
        err.style.display = 'block';
    }

    async function checkCurrentStatus() {
        try {
            const res = await fetch(`/whatsapp/setup/status?location_id=${locationId}`);
            if (!res.ok) throw new Error("Failed to load connections.");
            const data = await res.json();
            renderDevices(data.devices || []);
        } catch (err) {
            showError(err.message);
        }
    }

    function renderDevices(devices) {
        const list = document.getElementById('deviceList');
        list.innerHTML = '';
        
        if (devices.length === 0) {
            list.innerHTML = '<p style="text-align:center; margin-bottom: 0;">No numbers connected yet.</p>';
            return;
        }

        devices.forEach((dev, index) => {
            const isTarget = activeInstanceId === dev.instance_id;
            
            // If we are waiting for a QR scan on this device, show the QR box
            if (isTarget && dev.status === 'qr' && dev.qr) {
                document.getElementById('qrBox').style.display = 'flex';
                document.getElementById('loader').style.display = 'none';
                document.getElementById('statusText').style.display = 'none';
                document.getElementById('qrImage').src = dev.qr;
                document.getElementById('qrImage').style.display = 'block';
            } else if (isTarget && dev.status === 'open') {
                document.getElementById('qrBox').style.display = 'none';
                activeInstanceId = null;
            }

            // Build User Dropdown Options
            let optionsHtml = `<option value="">Generic (Load Balanced)</option>`;
            ghlUsers.forEach(u => {
                const isSelected = dev.ghl_assigned_user_id === u.id ? 'selected' : '';
                optionsHtml += `<option value="${u.id}" ${isSelected}>${u.name || u.firstName + ' ' + u.lastName}</option>`;
            });

            const card = document.createElement('div');
            card.className = 'device-card';
            card.style.flexDirection = 'column';
            card.style.alignItems = 'stretch';
            
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
                    <div class="device-info">
                        <div class="device-icon">
                            <svg viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.029 18.88c-1.161 0-2.305-.292-3.318-.844l-3.677.964.984-3.595c-.607-1.052-.927-2.246-.926-3.468.001-3.825 3.113-6.937 6.937-6.937 1.856.001 3.598.723 4.907 2.034 1.31 1.311 2.031 3.054 2.03 4.908-.001 3.825-3.113 6.938-6.937 6.938z"/></svg>
                        </div>
                        <div class="device-details">
                            <strong>WhatsApp Number ${index + 1}</strong>
                            <span>${dev.phone === 'pending' ? 'Not scanned yet' : dev.phone}</span>
                        </div>
                    </div>
                    <div>
                        <span class="device-status status-${dev.status === 'open' ? 'open' : (dev.status === 'qr' ? 'qr' : 'disconnected')}">
                            ${dev.status === 'open' ? 'Connected' : (dev.status === 'qr' ? 'Waiting QR' : 'Disconnected')}
                        </span>
                        ${dev.status !== 'open' ? `<button onclick="initializeConnection(false, '${dev.instance_id}')" style="margin-top:8px; font-size:11px; padding:4px 8px; cursor:pointer;">Scan</button>` : ''}
                    </div>
                </div>
                <div style="background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
                    <label style="display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Assign to GHL Staff Member:</label>
                    <select onchange="assignUser('${dev.instance_id}', this)" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:13px; outline:none; transition: border-color 0.2s;">
                        ${optionsHtml}
                    </select>
                </div>
            `;
            list.appendChild(card);
        });
    }

    async function initializeConnection(forceNew, instance_id = null) {
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('qrBox').style.display = 'flex';
        document.getElementById('qrImage').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('statusText').style.display = 'block';
        document.getElementById('statusText').textContent = 'Initializing WhatsApp engine...';

        try {
            const res = await fetch('/whatsapp/setup/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ location_id: locationId, forceNew, instance_id })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to initialize connection.");
            
            // Set active instance so the UI knows which QR to show
            if (data.status === 'qr' && data.qr) {
                activeInstanceId = instance_id || 'new'; // It will refresh on next poll
            }

            checkCurrentStatus(); // Immediately refresh the list
        } catch (err) {
            showError(err.message);
            document.getElementById('qrBox').style.display = 'none';
        }
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(checkCurrentStatus, 3000);
    }
</script>
</body>
</html>
